
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
    <div>
        <h1 id="first">Rock Paper Scissor</h1>
        <img id="rock" src="rock.jpg" onclick="play('rock')">
        <img id="paper" src="paper.jpg" onclick="play('paper')">
        <img id="scissor" src="seissor.png" onclick="play('scissor')">
        <h2 id="user">Your Choice:</h2>
        <h2 id="ai">AI Choice:</h2>
        <h2 id="humanscore">Your Score: 0</h2>
        <h2 id="aiscore">AI Score: 0</h2>
        <h2 id="result">Result:</h2>
    </div>
    </center>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <script src="script.js"></script>
</body>
</html>
</body>
</html>
